# Neurons -- PostgreSQL (base de controle de l'application).
# Usage : kubectl -n neurons apply -f postgres.yaml
# Le volume utilise la StorageClass par defaut du cluster.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      terminationGracePeriodSeconds: 60
      # PostgreSQL tourne directement sous son propre compte (uid 999 dans
      # l'image officielle), jamais en root. Lance en root, l'image fait un
      # chown du dossier de donnees : refuse sur un volume NFS (root_squash),
      # d'ou "chown: Operation not permitted" et un CrashLoopBackOff
      # (constate chez un client avec la StorageClass NFS cdf-nfs).
      # En 999, pas de chown : il suffit que le dossier soit inscriptible,
      # ce qui est le cas avec local-path comme avec NFS.
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      imagePullSecrets:
        - name: neurones-registry
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-secret
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          # Le 1er demarrage (initdb, puis creation de la base "neurones") peut
          # durer plusieurs minutes sur un NFS lent. Sans cette sonde, la sonde
          # de vie tuait le conteneur au milieu (vers 90 s) : au redemarrage, le
          # dossier n'etant plus vide, l'image sautait la creation de la base
          # ("database neurones does not exist", lab OpenText du 29/10/2026).
          # Jusqu'a 15 minutes avant que la sonde de vie prenne le relais.
          # -h 127.0.0.1 : le serveur provisoire de l'initialisation n'ecoute pas
          # en TCP, la sonde ne passe donc qu'une fois la base creee.
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-h", "127.0.0.1"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "neurones"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 20
            # 1 s par defaut : trop court quand le NFS est lent (constate le 29/10 :
            # "pg_isready timed out after 1s"), le conteneur serait tue sans raison.
            timeoutSeconds: 5
            failureThreshold: 6
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
