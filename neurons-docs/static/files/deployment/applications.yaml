  ENV: production
  REDIS_URL: redis://neurones-redis:6379/0
  POSTGRES_SERVER: postgres
  POSTGRES_PORT: '5432'
  VERTICA_SERVER: __VERTICA_HOST__
  VERTICA_PORT: '5433'
  VERTICA_DB: __VERTICA_DB__
  VERTICA_USER: neurones_reader
  VERTICA_MONITOR_ENABLED: '0'
  ALLOWED_ORIGINS: __ADRESSE__
  OTEL_ENABLED: 'false'
  OTEL_ENABLE_METRICS: 'false'
  OTEL_SERVICE_NAME: neurones-backend
  OTEL_SERVICE_NAMESPACE: neurones
  OTEL_SERVICE_VERSION: v1.6.13-otel3
  OTEL_DEPLOYMENT_ENV: client
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neurones-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: neurones-redis
  template:
    metadata:
      labels:
        app: neurones-redis
    spec:
      containers:
      - name: redis
        image: redis:7.4-alpine
        args:
        - --save
        - ''
        - --appendonly
        - 'no'
        - --maxmemory
        - 64mb
        ports:
        - name: redis
          containerPort: 6379
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: redis
          periodSeconds: 20
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 128Mi
      imagePullSecrets:
      - name: neurones-registry
---
apiVersion: v1
kind: Service
metadata:
  name: neurones-redis
spec:
  type: ClusterIP
  selector:
    app: neurones-redis
  ports:
  - name: redis
    port: 6379
    targetPort: redis
