# Neurons -- the applications (13 services), their web routes and autoscalers.
# Generated from the neurones-installer template (same versions as production).
# The __...__ markers are replaced by the deployment guide (sed).
apiVersion: v1
kind: ConfigMap
metadata:
  name: apm-vertica-config
data:
  VERTICA_HOST: __VERTICA_HOST__
  VERTICA_PORT: '5433'
  VERTICA_DB: __VERTICA_DB__
  VERTICA_USER: neurones_writer
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: apm-app-config
data:
  POSTGRES_SERVER: postgres
  POSTGRES_PORT: '5432'
  JOB_LOCK_ENABLED: 'true'
  KAFKA_BOOTSTRAP_SERVERS: neurons-kafka-kafka-bootstrap:9092
  FLUSH_INTERVAL_S: '2'
  SPAN_PROMOTED_ATTRS_READ: 'false'
  SPANS_SKIP_RUM_EVENTS: ''
  ROLLUP_AGG_THRESHOLD_MIN: '120'
  PREAGG_SERIES_READ: 'true'
  PREAGG_SERIES_RETENTION_HOURS: '72'
  PREAGG_RUM_PAGE_LOAD_FROM_PARTIALS: 'true'
  QUERY_RESPONSE_CACHE: 'true'
  QUERY_RESPONSE_CACHE_TTL_S: '10'
  QUERY_BULKHEADS: logs:^/logs$:3;servicemap:service-map:3;traces:^/traces$:4
  QUERY_BULKHEAD_WAIT_S: '30'
  LOGS_FIRST_SLICE_SEC: '30'
  LOGS_REFRESH_LATE_HORIZON_MIN: '15'
  LOGS_REQUEST_BUDGET_S: '20'
  VISUAL_ATTRS_LOOKBACK_H: '24'
  VISUAL_ATTRS_CACHE_S: '300'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apm-ingest
spec:
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  selector:
    matchLabels:
      app: apm-ingest
  template:
    metadata:
      labels:
        app: apm-ingest
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: apm-ingest
      imagePullSecrets:
      - name: neurones-registry
      terminationGracePeriodSeconds: 120
      containers:
      - name: ingest
        image: __IMAGE_APM__
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
        envFrom:
        - configMapRef:
            name: apm-vertica-config
        - configMapRef:
            name: apm-app-config
        - secretRef:
            name: postgres-secret
        - secretRef:
            name: apm-secret
        env:
        - name: APM_ROLE
          value: ingest
        - name: INGEST_MODE
          value: kafka
        lifecycle:
          preStop:
            exec:
              command:
              - sh
              - -c
              - sleep 15
        startupProbe:
          httpGet:
            path: /metrics
            port: http
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /metrics
            port: http
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: 500m
            memory: 768Mi
          limits:
            memory: 1536Mi
---
apiVersion: v1
kind: Service
metadata:
  name: apm-ingest
spec:
  type: ClusterIP
  selector:
    app: apm-ingest
  ports:
  - name: http
    port: 8000
    targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: apm-ingest
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: apm-ingest
  minReplicas: 1
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: apm-ingest
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: apm-ingest
---
