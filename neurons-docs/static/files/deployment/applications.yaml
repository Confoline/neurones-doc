apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-health-checker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: platform-health-checker
  template:
    metadata:
      labels:
        app: platform-health-checker
    spec:
      imagePullSecrets:
      - name: neurones-registry
      containers:
      - name: checker
        image: __IMAGE_APM__
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -m
        - platform_health
        envFrom:
        - configMapRef:
            name: apm-vertica-config
        - configMapRef:
            name: apm-app-config
        - secretRef:
            name: postgres-secret
        - secretRef:
            name: apm-secret
        env:
        - name: PLATFORM_HEALTH_FRONTEND_URL
          value: http://neurones-frontend:3000/
        - name: PLATFORM_HEALTH_BACKEND_URL
          value: http://neurones-api:8000
        - name: PLATFORM_HEALTH_QUERY_API_URL
          value: http://apm-query:8000
        - name: PLATFORM_HEALTH_INTERVAL_S
          value: '60'
        - name: PLATFORM_HEALTH_VERTICA_MIRROR
          value: 'false'
        - name: PLATFORM_HEALTH_AUTOMATION_CHECK
          value: 'true'
        - name: PLATFORM_HEALTH_DATA_FRESHNESS
          value: 'true'
        livenessProbe:
          exec:
            command:
            - python
            - -c
            - import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/platform_health.heartbeat')<180 else 1)
          initialDelaySeconds: 90
          periodSeconds: 60
          failureThreshold: 2
        resources:
          requests:
            cpu: 20m
            memory: 96Mi
          limits:
            memory: 256Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: neurons-automation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: neurons-automation
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  resourceNames:
  - apm-ingest
  - apm-query
  - neurones-frontend
  - neurones-backend
  verbs:
  - get
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: neurons-automation
subjects:
- kind: ServiceAccount
  name: neurons-automation
  namespace: neurons
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: neurons-automation
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neurons-automation
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: neurons-automation
  template:
    metadata:
      labels:
        app: neurons-automation
    spec:
      serviceAccountName: neurons-automation
      imagePullSecrets:
      - name: neurones-registry
      containers:
      - name: automation
        image: __IMAGE_APM__
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -m
        - neurons_automation
        envFrom:
        - configMapRef:
            name: apm-app-config
        - secretRef:
            name: postgres-secret
        env:
        - name: AUTOMATION_MODE
          value: dry_run
        - name: AUTOMATION_TEST_ACTIONS
          value: 'false'
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        ports:
        - name: health
          containerPort: 8080
        livenessProbe:
          httpGet:
            path: /health
            port: health
          initialDelaySeconds: 60
          periodSeconds: 60
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: health
          periodSeconds: 30
        resources:
          requests:
            cpu: 20m
            memory: 96Mi
          limits:
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: neurons-automation
spec:
  type: ClusterIP
  selector:
    app: neurons-automation
  ports:
  - name: health
    port: 8080
    targetPort: health
---
apiVersion: v1
