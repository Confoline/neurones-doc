apiVersion: apps/v1
kind: Deployment
metadata:
  name: apm-loader
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: apm-loader
  template:
    metadata:
      labels:
        app: apm-loader
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: apm-loader
      imagePullSecrets:
      - name: neurones-registry
      terminationGracePeriodSeconds: 60
      containers:
      - name: loader
        image: __IMAGE_APM__
        imagePullPolicy: IfNotPresent
        command:
        - python
        - kafka_loader.py
        envFrom:
        - configMapRef:
            name: apm-vertica-config
        - configMapRef:
            name: apm-app-config
        - secretRef:
            name: postgres-secret
        - secretRef:
            name: apm-secret
        env:
        - name: KAFKA_LOADER_GROUP
          value: apm-vertica-loader
        - name: LOADER_BATCH_ROWS
          value: '50000'
        - name: LOADER_FLUSH_INTERVAL_S
          value: '10'
        - name: VERTICA_RESOURCE_POOL
          value: apm_loader_pool
        - name: PREAGG_ENABLED
          value: 'true'
        - name: PREAGG_TRACES_ENABLED
          value: 'true'
        - name: PREAGG_RUM_CALLS_ENABLED
          value: 'true'
        - name: PREAGG_DB_CALLS_ENABLED
          value: 'true'
        - name: PREAGG_LOG_COUNTS_ENABLED
          value: 'true'
        - name: PREAGG_RUM_PAGE_LOAD_ENABLED
          value: 'true'
        - name: PREAGG_SERVICE_VERSIONS_ENABLED
          value: 'true'
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - test -n "$(find /tmp/loader-alive -mmin -5 2>/dev/null)"
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 3
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            memory: 1Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: apm-loader
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: apm-loader
