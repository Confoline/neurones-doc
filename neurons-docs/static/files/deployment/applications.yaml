apiVersion: apps/v1
kind: Deployment
metadata:
  name: neurones-backend
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
  selector:
    matchLabels:
      app: neurones-backend
  template:
    metadata:
      labels:
        app: neurones-backend
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: neurones-backend
      imagePullSecrets:
      - name: neurones-registry
      containers:
      - name: backend
        image: __IMAGE_BACKEND__
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
        envFrom:
        - configMapRef:
            name: neurones-backend-config
        - secretRef:
            name: postgres-secret
        - secretRef:
            name: neurones-backend-secret
        env:
        - name: CMDB_SYNC_SCHEDULER_ENABLED
          value: '0'
        - name: VERTICA_MONITOR_ENABLED
          value: '0'
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            memory: 1Gi
